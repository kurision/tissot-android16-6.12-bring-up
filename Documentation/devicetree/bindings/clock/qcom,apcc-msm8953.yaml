%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,apcc-msm8953.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8953 APCS CPU Clock Controller

maintainers:
  - Andy Gross <agross@kernel.org>

description: >
  The APCS block on MSM8953 contains the single APCS HF PLL that feeds both
  Cortex-A53 clusters and the system CCI, plus the three RCGCGR mux-dividers
  in front of them. All eight cores share one PLL and one voltage domain, so
  the PLL and mux-dividers are private to the controller. The three exported
  clock IDs report the rates of the two clusters and CCI. The two CPU clock
  IDs alias one shared domain clock. CPU rate changes are coupled across both
  clusters; CCI is read-only and follows the PLL at a fixed divide by 2.5.

  The block also owns the shared APC voltage rail. The regulator it drives is
  corner encoded rather than microvolt based, so the rail is programmed from
  a fused rate to corner plan read from this node, and the highest corner
  needed by the three outputs is applied before any frequency increase. The
  old voltage requirement is retained until all outputs have changed rate.
  The HF PLL logic additionally requires an active-only MX SVS level vote
  throughout the stock frequency range.

properties:
  compatible:
    const: qcom,apcc-msm8953

  reg:
    items:
      - description: APCS HF PLL register block
      - description: RCGCGR for CPU0 through CPU3
      - description: RCGCGR for CPU4 through CPU7
      - description: RCGCGR for the system CCI
      - description: PTE EFUSE, the fused speed bin lives in bits 8-10

  reg-names:
    items:
      - const: pll
      - const: cpu0-rcg-clk
      - const: cpu4-rcg-clk
      - const: cci-rcg-clk
      - const: pte-efuse

  clocks:
    items:
      - description: XO, the PLL reference and the bring-up source of the CPUs
      - description: GPLL0 early output, a boot time mux source
      - description: GPLL2 early output, a boot time mux source

  clock-names:
    items:
      - const: xo
      - const: gpll0_early
      - const: gpll2_early

  vdd-cl-supply:
    description:
      Regulator that supplies the shared APC rail. On this port it is the
      CPR4 APC regulator, whose values are corner numbers and not
      microvolts, with regulator-min-microvolt and regulator-max-microvolt
      spanning the corner range.

  power-domains:
    items:
      - description: Active-only MX domain supplying the HF PLL logic

  power-domain-names:
    items:
      - const: mx

  "#clock-cells":
    const: 1

patternProperties:
  "^qcom,speed[0-9]+-bin-v[0-9]+-(cl|cci)$":
    description: >
      Fused rate to corner plan for the CPU clusters (cl) or the CCI (cci),
      selected by the speed bin in the PTE EFUSE and the PVS version.
      The cells are rate in Hz and corner pairs in ascending rate order, so
      the cell count is even and the first pair is the idle one, rate 0
      corner 0. The driver falls back to the speed0 plan when no entry
      matches the fused bin.
    $ref: /schemas/types.yaml#/definitions/uint32-array

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - vdd-cl-supply
  - power-domains
  - power-domain-names
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8953.h>
    #include <dt-bindings/power/qcom-rpmpd.h>

    xo: xo {
        #clock-cells = <0>;
    };

    gcc: clock-controller {
        compatible = "qcom,gcc-msm8953";
        #clock-cells = <1>;
    };

    apc_vreg: regulator {
        compatible = "regulator-fixed";
    };

    apcc: clock-controller@b116000 {
        compatible = "qcom,apcc-msm8953";
        reg = <0xb116000 0x50>,
              <0xb111050 0x10>,
              <0xb011050 0x10>,
              <0xb1d1050 0x10>,
              <0xa4124 0x8>;
        reg-names = "pll", "cpu0-rcg-clk", "cpu4-rcg-clk", "cci-rcg-clk",
                    "pte-efuse";
        clocks = <&xo>, <&gcc GPLL0_EARLY>, <&gcc GPLL2_EARLY>;
        clock-names = "xo", "gpll0_early", "gpll2_early";
        vdd-cl-supply = <&apc_vreg>;
        power-domains = <&rpmpd MSM8953_VDDMX_AO>;
        power-domain-names = "mx";
        qcom,speed0-bin-v0-cl = <0 0 652800000 1 1036800000 2
                                 1401600000 3 1689600000 4
                                 1804800000 5 1958400000 6
                                 2016000000 7>;
        qcom,speed0-bin-v0-cci = <0 0 261120000 1 414720000 2
                                  560640000 3 675840000 4
                                  721920000 5 783360000 6
                                  806400000 7>;
        #clock-cells = <1>;
    };
...
